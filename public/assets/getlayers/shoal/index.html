<style>
  :root { color-scheme: dark }
  html, body { margin: 0; height: 100%; background: #8fa3b8; overflow: hidden }
  #gl { display: block; width: 100vw; height: 100vh }
  #fade { position: fixed; inset: 0; background: #8fa3b8; pointer-events: none; opacity: 1; transition: opacity 1.1s ease }

  /* ====== UI PANEL (copy-paste identical across gradients) ====== */
  #ui-panel { position: fixed; top: 12px; right: 12px; width: 286px; max-height: calc(100vh - 24px); overflow: auto;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #dde3ee; z-index: 10;
    background: rgba(9, 11, 17, .78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.10); border-radius: 12px; padding: 10px 12px 12px }
  #ui-panel.closed > *:not(#ui-head) { display: none }
  #ui-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; margin-bottom: 8px }
  #ui-head b { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 10px; opacity: .8 }
  #ui-fps { opacity: .55; font-variant-numeric: tabular-nums }
  .ui-sec { margin: 10px 0 4px; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; opacity: .42 }
  .ui-row { display: grid; grid-template-columns: 96px 1fr 42px; align-items: center; gap: 6px; margin: 3px 0 }
  .ui-row label { opacity: .72; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .ui-row input[type=range] { width: 100%; accent-color: #7f9cff; height: 14px }
  .ui-row input[type=color] { width: 100%; height: 18px; padding: 0; border: 0; background: none; border-radius: 4px }
  .ui-row span { text-align: right; opacity: .55; font-variant-numeric: tabular-nums }
  #ui-preset optgroup { background: #0b0d13; color: #9aa4b8; font-style: normal }
  #ui-preset option { background: #0b0d13; color: #dde3ee }
  #ui-preset { width: 100%; margin-bottom: 4px; background: rgba(255,255,255,.06); color: #dde3ee;
    border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 4px 6px; font: inherit }
  .ui-btns { display: flex; gap: 6px; margin-top: 10px }
  .ui-btns button { flex: 1; cursor: pointer; background: rgba(255,255,255,.06); color: #dde3ee;
    border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 5px 0; font: inherit }
  .ui-btns button:hover { background: rgba(255,255,255,.12) }
  #ui-rnd-all { width: 100%; margin-top: 6px; cursor: pointer; font: inherit; color: #dde3ee;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 6px 0 }
  #ui-rnd-all:hover { background: rgba(255,255,255,.13) }
  #ui-save { width: 100%; margin-top: 6px; cursor: pointer; font: inherit; color: #dde3ee;
    background: rgba(127,156,255,.16); border: 1px solid rgba(127,156,255,.44); border-radius: 6px; padding: 6px 0 }
  #ui-save:hover { background: rgba(127,156,255,.3) }
  /* ---- the group: the rolls of this gradient that were worth keeping. They are written
     into the JSON block below the panel, so the file carries its own variants. */
  #ui-add-group { width: 100%; margin-top: 6px; cursor: pointer; font: inherit; color: #dde3ee;
    background: rgba(255,255,255,.05); border: 1px dashed rgba(255,255,255,.24); border-radius: 6px; padding: 6px 0 }
  #ui-add-group:hover { background: rgba(255,255,255,.12) }
  .ui-grp { margin-top: 10px }
  .ui-grp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 5px;
    font-size: 9px; letter-spacing: .12em; text-transform: uppercase; opacity: .42 }
  .ui-grp-head em { font-style: normal; letter-spacing: .04em; text-transform: none }
  .ui-grp-list { display: flex; flex-wrap: wrap; gap: 4px }
  .ui-grp-list:empty::after { content: 'no variants yet'; font-size: 10px; opacity: .34 }
  .ui-var { width: 44px; height: 24px; padding: 0; cursor: pointer; font: inherit; font-size: 9px;
    color: rgba(255,255,255,.9); text-shadow: 0 1px 2px rgba(0,0,0,.75); background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.16); border-radius: 5px }
  .ui-var:hover { border-color: rgba(255,255,255,.55) }
  /* the one whose values are the live ones — moving any slider puts it out */
  .ui-var.on { border-color: rgba(127,156,255,.95); box-shadow: 0 0 0 1px rgba(127,156,255,.45) }
  #ui-note { margin-top: 6px; min-height: 14px; font-size: 10px; line-height: 1.4; opacity: .62 }
  #ui-snapshot { margin: 8px 0 0; padding: 8px; max-height: 168px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    background: rgba(0,0,0,.35); border-radius: 6px; font-size: 10px; line-height: 1.45; opacity: .72 }
</style>

<script>
/* ====== CONFIG ====== */
const CONFIG = {
  bgColor:  '#8fa3b8',
  colorA:   '#b7c5d3',
  colorB:   '#d5dbdd',
  colorC:   '#f0e6d8',
  colorD:   '#fffaf2',

  scale:            1.30,
  speed:            0.33,      // slow. see Architecture/Slow and Slick
  chop:             0.55,      // how fast the crests travel (dispersion-scaled per wave)
  waveBase:         2.80,      // wavenumber of the longest swell
  waveLac:          1.58,      // frequency growth per wave
  waveGain:         0.60,      // amplitude falloff per wave
  drift:            0.40,      // fbm domain drift — keeps the wave lattice off the grid
  driftScale:       0.55,

  depth:            2.10,      // refraction distance floor↔surface — sets how often the sheet folds
  counter:          0.80,      // strength of the counter-folded sheet — 0 leaves half the frame empty
  dispersion:       0.22,      // depth split between the three refracted bands — the fringe width
  iris:             0.35,      // how far a fringe walks the ramp — the iridescence
  soften:           0.20,      // width of a caustic filament — wide, so light pools instead of wiring
  focus:            1.00,      // exponent on the fold intensity
  edgeAA:           1.60,      // fwidth widening — filaments never thinner than a pixel
  ambient:          0.42,      // how much raw swell modulates the exposure

  // The field gets its full structural range back here; softness comes from the
  // narrow luminance span of the palette, not from flattening the field — that
  // route just washes the frame out.
  contrast:         1.25,
  midpoint:         0.42,

  bandAmount:       0.00,
  bandCount:        7,
  bandSoft:         0.45,

  glow:             0.05,
  sink:             0.30,
  grain:            0,        // off by default — house grain, turn it up to taste
  grainAnim:        0,        // 0 static · 1 re-seeds the grain like film
  dither:           1.35,      // pale midtones are where 8-bit stepping shows
  vignette:         0.05,      // a dark ring on a pale field is obvious — keep it near off
  cursor:           1,        // 1 follows the hand · 0 ignores it (fully ambient)

  pointerRadius:    1.05,
  pointerStrength:  0.12,      // how much the cursor deepens the water
  pointerWarp:      0.45,      // how far the drift field bends the pointer's own reach
  drag:             0.16,      // how much the field is pulled along under the cursor
  ripple:           0.30,      // amplitude of the swell the cursor raises
  rippleFreq:       11.00,     // how tightly the rings are spaced
  rippleSpeed:      1.10,      // how fast they travel outward
  parallax:         0.0033,

  maxDpr:           1.0       // 1× by default. raise it only if the look demands it
}

/* ====== COLOR PRESETS — 20 per gradient, grouped. Colours only, never effect knobs. ====== */
const PRESETS = {
  light: {

    'Lavender Haze':   { bgColor: '#a8a7bd', colorA: '#c5c4d5', colorB: '#dedde7', colorC: '#efe9ec', colorD: '#fdfbfc' },

    'Peach Vapour':    { bgColor: '#c3a99c', colorA: '#d8c4b9', colorB: '#ead9d0', colorC: '#f7ece4', colorD: '#fffaf5' },

    'Rose Clay':       { bgColor: '#bfa6a4', colorA: '#d5c1bf', colorB: '#e8d8d5', colorC: '#f6eae7', colorD: '#fffaf8' }

    'Stone':           { bgColor: '#adaeaa', colorA: '#c8c9c4', colorB: '#e0e0dc', colorC: '#f0f0ec', colorD: '#fdfdfa' },
    'Tidal Grey':      { bgColor: '#a3aab2', colorA: '#c2c8ce', colorB: '#dde1e5', colorC: '#eeeeec', colorD: '#fcfcfa' },
    'Ash Lilac':       { bgColor: '#aea4ae', colorA: '#cac2c9', colorB: '#e1dbdf', colorC: '#f0ebed', colorD: '#fdfbfc' }
  },
  dark: {
    'Deep Shoal':      { bgColor: '#1c242e', colorA: '#354150', colorB: '#6d8592', colorC: '#c8bfb2', colorD: '#f4eee5' },
    'Nacre Dusk':      { bgColor: '#232432', colorA: '#3d3e54', colorB: '#747690', colorC: '#c2b8c4', colorD: '#f3eff2' },
    'Slate Tide':      { bgColor: '#1e2528', colorA: '#37454a', colorB: '#6f8785', colorC: '#c5c0aa', colorD: '#f1f0e7' },
    'Ink Pearl':       { bgColor: '#232326', colorA: '#3c3c42', colorB: '#75757e', colorC: '#bdb7b3', colorD: '#f2efec' }
  }
}


/* ====== DEFAULTS + PERSISTENCE (loaded BEFORE anything is built) ====== */
const DEFAULTS = JSON.parse(JSON.stringify(CONFIG))
const STORAGE_KEY = 'getlayers:003-shoal'
/* Opened on its own, this file remembers what you rolled: ⟳ reload comes back to it and
   ↺ reset throws it away. Embedded in the gallery it must NOT — there the file is what is
   being looked at, and a look remembered in this browser would beat the file itself: the
   card's still would be the saved defaults while its live preview showed something else
   entirely. Only ⤓ preview changes what this gradient is, and it changes the file. */
const OWN_WINDOW = window.parent === window
try { const s = OWN_WINDOW && JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); if (s) for (const k in s) if (k in CONFIG) CONFIG[k] = s[k] } catch (e) {}
function saveConfig() { if (!OWN_WINDOW) return; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(CONFIG)) } catch (e) {} }

function hexToVec3(hex) {
  const n = parseInt(hex.slice(1), 16)
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]
}

/* ====== GL BOILERPLATE (frozen chrome — do not edit per gradient) ====== */
const canvas = document.getElementById('gl')
const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance' })
if (!gl) {
  document.getElementById('fade').style.opacity = 0
  document.getElementById('ui-panel').style.display = 'none'
  document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;inset:0;display:grid;place-items:center;color:#889;font:13px system-ui">WebGL2 is not available in this browser.</p>')
  throw new Error('no webgl2')
}

const VERT = `#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`

/* ====== THE SHADER — ⭐ the only part that changes between gradients ====== */
const FRAG = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2  iResolution;
uniform float iTime;
uniform vec2  iMouse;          // aspect-corrected units, same space as uv

uniform vec3  uBg, uColorA, uColorB, uColorC, uColorD;
uniform float uScale, uSpeed, uChop, uWaveBase, uWaveLac, uWaveGain, uDrift, uDriftScale;
uniform float uDepth, uCounter, uDispersion, uIris, uSoften, uFocus, uEdgeAA, uAmbient;
uniform float uContrast, uMidpoint, uBandAmount, uBandCount, uBandSoft;
uniform float uGlow, uSink, uGrain, uDither, uVignette;
uniform float uPointerRadius, uPointerStrength, uPointerWarp, uDrag;
uniform float uRipple, uRippleFreq, uRippleSpeed, uParallax;

#define WAVES  6
#define OCTAVES 2

vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
}

float snoise(vec2 p) {
  const float K1 = 0.366025404, K2 = 0.211324865;
  vec2 i = floor(p + (p.x + p.y) * K1);
  vec2 a = p - i + (i.x + i.y) * K2;
  float m = step(a.y, a.x);
  vec2 o = vec2(m, 1.0 - m);
  vec2 b = a - o + K2;
  vec2 c = a - 1.0 + 2.0 * K2;
  vec3 h = max(0.5 - vec3(dot(a, a), dot(b, b), dot(c, c)), 0.0);
  vec3 n = h * h * h * h * vec3(dot(a, hash2(i)), dot(b, hash2(i + o)), dot(c, hash2(i + 1.0)));
  return dot(n, vec3(70.0));
}

float fbm(vec2 p) {
  float v = 0.0, amp = 0.5;
  for (int i = 0; i < OCTAVES; i++) { v += amp * snoise(p); p *= 2.02; amp *= 0.5; }
  return v;
}

// Wider overlaps than the house ramp (0.36/0.32, 0.70/0.66): every stop is still
// blending when the next one starts, which is what keeps a pale palette from
// showing the shoulder of a smoothstep as a soft band.
vec3 ramp4(float t) {
  vec3 c = mix(uColorA, uColorB, smoothstep(0.00, 0.44, t));
  c = mix(c, uColorC, smoothstep(0.26, 0.76, t));
  c = mix(c, uColorD, smoothstep(0.58, 1.00, t));
  return c;
}

// A caustic is where the refracted light sheet folds — where the area jacobian
// det(I + c*H) crosses zero. The width is sized once by the caller from fwidth of
// the reference band, so a filament is never thinner than a pixel at any scale
// or DPR; every band's det has the same screen-space gradient up to its depth
// scale, so six derivative pairs would buy nothing over one.
float fold(vec3 H, float c, float soft) {
  float det = (1.0 + c * H.x) * (1.0 + c * H.y) - c * c * H.z * H.z;
  return soft / (abs(det) + soft);                 // 1 on the fold, falling away from it
}

// triangular-PDF dither — the only reliable cure for 8-bit gradient banding
float triDither(vec2 fc) {
  float a = fract(sin(dot(fc, vec2(12.9898, 78.233))) * 43758.5453);
  float b = fract(sin(dot(fc + 17.0, vec2(12.9898, 78.233))) * 43758.5453);
  return (a + b - 1.0) / 255.0;
}

// ---- house grain. ONE look across the collection: an integer hash (no sin() streaks),
// triangular so it reads as film rather than static, weighted into the midtones so it
// never crusts a black or a white. Static by default; uGrainAnim re-seeds it 24×/s.
uniform float uGrainAnim;
float houseGrain(vec2 fc) {
  uvec2 q = uvec2(fc) * uvec2(1597334677u, 3812015801u)
          + uint(floor(iTime * 24.0 * uGrainAnim)) * 2654435769u;
  uint n = q.x ^ q.y; n = n * 1664525u + 1013904223u; n ^= n >> 16u; n *= 2246822519u; n ^= n >> 13u;
  float a = float(n & 0xffffu) / 65535.0;
  n *= 3266489917u; n ^= n >> 16u;
  float b = float(n & 0xffffu) / 65535.0;
  return a + b - 1.0;
}
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * iResolution) / iResolution.y;
  float t = iTime * uSpeed;

  vec2 p = (uv - iMouse * uParallax) * uScale;

  // slow fbm drift, so the wave lattice never sits on a rigid grid
  vec2 w = vec2(fbm(p * uDriftScale + vec2(0.0, t * 0.19)),
                fbm(p * uDriftScale + vec2(4.7, 2.1) - t * 0.13));

  // The pointer is measured in the DRIFTED domain, not in screen space: its
  // reach is an organic shape that breathes with the field rather than a circle
  // pasted over it, and it costs nothing — w is already here for the warp.
  vec2 dm = (uv - iMouse) + w * uPointerWarp;
  float rr = length(dm);
  float q2 = dot(dm, dm) / max(1e-4, uPointerRadius * uPointerRadius);
  float near = 1.0 / (1.0 + q2 * q2);                       // gentler shoulder and a longer tail than a gaussian

  // and it drags the field with it — dm * falloff, never normalize(dm), which
  // would put a singularity right under the cursor
  vec2 qd = p + uDrift * w + dm * (near * uDrag * uScale);

  // ONE pass over the wave set yields both the surface height and its Hessian.
  // Amplitude per wave is chosen in curvature space, so no octave dominates H.
  float hgt = 0.0, wsum = 0.0;
  vec3 H = vec3(0.0);                       // (hxx, hyy, hxy) — curvature of the surface
  float k = uWaveBase, amp = 1.0;
  float sk = sqrt(uWaveBase), slac = sqrt(uWaveLac);   // sqrt(k) carried forward, not recomputed per wave
  for (int i = 0; i < WAVES; i++) {
    float a = float(i) * 2.39996323;        // golden angle — no two crest sets ever align
    vec2 dir = vec2(cos(a), sin(a));        // a is constant per unrolled step, so this folds away
    float s = sin(k * dot(dir, qd) + sk * t * uChop + float(i) * 1.7);   // sqrt(k): deep-water dispersion, so every wave has its own rate
    hgt += amp * s;
    H   -= amp * s * vec3(dir.x * dir.x, dir.y * dir.y, dir.x * dir.y);
    wsum += amp;
    k *= uWaveLac;
    sk *= slac;
    amp *= uWaveGain;
  }
  hgt /= wsum;
  H   /= wsum;

  // The cursor raises a slow radial swell. Its dominant curvature is radial, so
  // it enters as one more plane wave whose direction is the radial unit vector —
  // the rings fold light with exactly the same maths as everything else, rather
  // than being painted on top.
  vec2 ru = dm / max(rr, 1e-3);
  float rs = sin(rr * uRippleFreq - iTime * uRippleSpeed);
  // ramp the rings in over their own first wavelength: at rr = 0 the radial
  // direction is undefined, and sin(-t) is not zero there — without this the
  // pointer sits on a permanent bright speck
  float rAmp = uRipple * near * smoothstep(0.0, 6.2831853 / max(1.0, uRippleFreq), rr);
  hgt += rAmp * rs * 0.5;
  H   -= rAmp * rs * vec3(ru.x * ru.x, ru.y * ru.y, ru.x * ru.y);

  // Three bands refract at slightly different depths, so each fold lands in
  // three slightly different places. Where they separate you get a fringe —
  // the iridescence on every edge. Six folds, all sharing the one Hessian.
  float lens = 1.0 + uPointerStrength * near * 3.0;         // and the water deepens under the cursor
  float c0 = uDepth * lens;
  float detR = (1.0 + c0 * H.x) * (1.0 + c0 * H.y) - c0 * c0 * H.z * H.z;   // the reference band
  float soft = uSoften + fwidth(detR) * uEdgeAA;            // one derivative pair sizes the whole stack
  vec3 band = vec3(1.0 - uDispersion, 1.0, 1.0 + uDispersion);
  vec3 G = vec3(fold(H,  c0 * band.x, soft), soft / (abs(detR) + soft), fold(H,  c0 * band.z, soft))
         + vec3(fold(H, -c0 * band.x, soft), fold(H, -c0, soft), fold(H, -c0 * band.z, soft)) * uCounter;
  G /= 1.0 + uCounter;

  float irid = G.z - G.x;                                   // signed fringe — which band folded here
  float g = pow((G.x + G.y + G.z) / 3.0, uFocus);           // shape the achromatic light only — one pow, not three

  float f = g + hgt * 0.5 * uAmbient;                       // the swell modulates exposure, the folds draw the light
  f = clamp((f - uMidpoint) * uContrast + 0.5, 0.0, 1.0);

  // optional posterise into soft bands
  float steps = max(1.0, floor(uBandCount));
  float fs = f * steps;
  float banded = (floor(fs) + smoothstep(0.5 - uBandSoft * 0.5, 0.5 + uBandSoft * 0.5, fract(fs))) / steps;
  f = mix(f, banded, uBandAmount);

  vec3 col = ramp4(clamp(f + irid * uIris, 0.0, 1.0));      // the fringe walks the ramp — iridescent edges
  col += uColorD * uGlow * pow(f, 4.0);
  col = mix(uBg, col, smoothstep(0.0, max(0.01, uSink), f) * 0.90 + 0.10);

  col *= 1.0 - uVignette * dot(uv, uv);
  { float hgL = clamp(dot(col, vec3(0.299, 0.587, 0.114)), 0.0, 1.0);
    col += houseGrain(gl_FragCoord.xy) * uGrain * mix(1.0, 4.0 * hgL * (1.0 - hgL), 0.6); }
  col += triDither(gl_FragCoord.xy) * uDither;

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`

function compile(type, src) {
  const sh = gl.createShader(type)
  gl.shaderSource(sh, src)
  gl.compileShader(sh)
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh))
  return sh
}

const program = gl.createProgram()
gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT))
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG))
gl.linkProgram(program)
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program))
gl.useProgram(program)
gl.bindVertexArray(gl.createVertexArray())

const LOC = {}
const loc = n => (n in LOC ? LOC[n] : (LOC[n] = gl.getUniformLocation(program, n)))
const u1f = (n, v) => gl.uniform1f(loc(n), v)
const u2f = (n, x, y) => gl.uniform2f(loc(n), x, y)
const u3c = (n, hex) => { const c = hexToVec3(hex); gl.uniform3f(loc(n), c[0], c[1], c[2]) }

/* ====== CONFIG → UNIFORMS ====== */
function applyConfig() {
  gl.useProgram(program)
  u3c('uBg', CONFIG.bgColor)
  u3c('uColorA', CONFIG.colorA)
  u3c('uColorB', CONFIG.colorB)
  u3c('uColorC', CONFIG.colorC)
  u3c('uColorD', CONFIG.colorD)
  u1f('uScale', CONFIG.scale)
  u1f('uSpeed', CONFIG.speed)
  u1f('uChop', CONFIG.chop)
  u1f('uWaveBase', CONFIG.waveBase)
  u1f('uWaveLac', CONFIG.waveLac)
  u1f('uWaveGain', CONFIG.waveGain)
  u1f('uDrift', CONFIG.drift)
  u1f('uDriftScale', CONFIG.driftScale)
  u1f('uDepth', CONFIG.depth)
  u1f('uCounter', CONFIG.counter)
  u1f('uDispersion', CONFIG.dispersion)
  u1f('uIris', CONFIG.iris)
  u1f('uSoften', CONFIG.soften)
  u1f('uFocus', CONFIG.focus)
  u1f('uEdgeAA', CONFIG.edgeAA)
  u1f('uAmbient', CONFIG.ambient)
  u1f('uContrast', CONFIG.contrast)
  u1f('uMidpoint', CONFIG.midpoint)
  u1f('uBandAmount', CONFIG.bandAmount)
  u1f('uBandCount', CONFIG.bandCount)
  u1f('uBandSoft', CONFIG.bandSoft)
  u1f('uGlow', CONFIG.glow)
  u1f('uSink', CONFIG.sink)
  u1f('uGrain', CONFIG.grain)
  u1f('uGrainAnim', CONFIG.grainAnim)
  u1f('uDither', CONFIG.dither)
  u1f('uVignette', CONFIG.vignette)
  u1f('uPointerRadius', CONFIG.pointerRadius)
  u1f('uPointerStrength', CONFIG.pointerStrength)
  u1f('uPointerWarp', CONFIG.pointerWarp)
  u1f('uDrag', CONFIG.drag)
  u1f('uRipple', CONFIG.ripple)
  u1f('uRippleFreq', CONFIG.rippleFreq)
  u1f('uRippleSpeed', CONFIG.rippleSpeed)
  u1f('uParallax', CONFIG.parallax)
  resize()
}

/* ====== RESIZE ====== */
let dpr = 1
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr)
  const w = Math.max(1, Math.round(innerWidth * dpr))
  const h = Math.max(1, Math.round(innerHeight * dpr))
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h }
  gl.viewport(0, 0, w, h)
  gl.useProgram(program)
  u2f('iResolution', w, h)
}
/* Coalesced to one resize per frame. A window drag or a phone rotation fires resize far
   faster than the display refreshes, and every raw call reallocates the drawing buffer and
   re-uploads iResolution — that burst is the hitch you feel while dragging an edge. */
let resizeQueued = false
addEventListener('resize', () => {
  if (resizeQueued) return
  resizeQueued = true
  requestAnimationFrame(() => { resizeQueued = false; resize() })
}, { passive: true })

/* ====== POINTER (four scalars — the only per-frame CPU maths allowed) ======
   A spring rather than the template's exponential lerp. Same O(1) two-scalar
   smoothing the GPU-Only Rule sanctions, but it carries velocity, so the field
   keeps drifting for a moment after the cursor stops and settles instead of
   arriving. That follow-through is the inertia; SPRING/DAMP are tuned just
   under critical (ζ ≈ 0.72) so it eases past and back without ever bouncing. */
const SPRING = 0.014, DAMP = 0.17
const mouse = { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0 }
/* One handler for both events, and it does exactly one job: write the target. Everything
   that moves is integrated in the render loop, so a flick that fires forty events inside a
   single frame costs the same as one that fires one — and a touch now aims on contact
   instead of staying dead until the first drag. */
const aim = e => {
  const a = innerWidth / innerHeight
  mouse.tx = (e.clientX / innerWidth - 0.5) * a
  mouse.ty = (0.5 - e.clientY / innerHeight)
}
addEventListener('pointermove', aim, { passive: true })
addEventListener('pointerdown', aim, { passive: true })

/* ====== RENDER LOOP ====== */
/* The loop does exactly four things: step the pointer followers by elapsed time, upload two uniforms,
   draw one triangle, tick the fps readout. Everything else is the shader's job. */
const fadeEl = document.getElementById('fade')
const fpsEl = document.getElementById('ui-fps')

let visible = true
new IntersectionObserver(es => { visible = es[0].isIntersecting }, { threshold: 0 }).observe(canvas)

const t0 = performance.now()
let prevT = t0, clock = 0, fpsT = t0, fpsN = 0
function frame(now) {
  requestAnimationFrame(frame)

  /* PACING — one clamped clock drives everything below it.
     `ms` is the real frame interval pinned to [4.17, 50] and `s` is that interval measured
     in 60 Hz frames, so every ease and every spring in this loop advances by elapsed TIME
     rather than by frame count — the same follow-lag on a 60, 120 or 144 Hz panel instead
     of a chase that doubles in speed when the monitor does. The upper clamp on `s` is what
     stops a dropped frame or a GC pause from flinging the chain across the screen in one
     step, and it sits low enough that no damping term can ever overshoot into a wobble.
     The shader clock is accumulated from the SAME clamped interval instead of read off the
     wall clock — rAF stops in a background tab but wall time does not, and handing the
     shader that gap is exactly what makes a field lurch on the way back. Clamped, an
     alt-tab costs a pause and never a jump. */
  const raw = now - prevT
  prevT = now
  if (!visible || document.hidden) return
  const ms = raw > 50 ? 50 : raw < 4.167 ? 4.167 : raw
  const s = ms > 36.7 ? 2.2 : ms * 0.06
  clock += ms * 0.001

  /* Stepped by elapsed time rather than once per frame. A per-frame step ties the follow-lag
     to the refresh rate — trailing at 60 Hz, near enough attached to the cursor at 144 — and
     lets a single long frame after a stall launch the spring. */
  mouse.vx += ((mouse.tx - mouse.x) * SPRING - mouse.vx * DAMP) * s   // slow follow — the pointer is felt, not tracked
  mouse.vy += ((mouse.ty - mouse.y) * SPRING - mouse.vy * DAMP) * s
  mouse.x += mouse.vx * s
  mouse.y += mouse.vy * s

  u1f('iTime', clock)
  /* cursor 0: the hand is ignored and the pointer eases back to where it rested — the
     gradient goes fully ambient. Nothing else changes, so it can be flipped live. */
  if (mouse.rest === undefined) mouse.rest = { x: mouse.tx, y: mouse.ty }
  if (!CONFIG.cursor) { mouse.tx = mouse.rest.x; mouse.ty = mouse.rest.y }

  u2f('iMouse', mouse.x, mouse.y)
  gl.drawArrays(gl.TRIANGLES, 0, 3)

  fpsN++
  if (now - fpsT > 500) {
    fpsEl.textContent = Math.round(fpsN * 1000 / (now - fpsT)) + ' fps · ' + dpr.toFixed(1) + '×'
    fpsT = now; fpsN = 0
  }
}

applyConfig()
gl.drawArrays(gl.TRIANGLES, 0, 3)        // one draw before the reveal, so we never fade onto a blank canvas
fadeEl.style.opacity = 0
requestAnimationFrame(frame)

/* ====== UI ====== */
const numericRanges = {
  scale:      { min: 0.2, max: 6,   step: 0.01 },
  speed:      { min: 0,   max: 0.6, step: 0.005 },
  chop:       { min: 0,   max: 2,   step: 0.01 },
  waveBase:   { min: 0.5, max: 8,   step: 0.01 },
  waveLac:    { min: 1.1, max: 2.6, step: 0.01 },
  waveGain:   { min: 0.3, max: 0.95, step: 0.01 },
  drift:      { min: 0,   max: 2,   step: 0.01 },
  driftScale: { min: 0.1, max: 3,   step: 0.01 },
  depth:      { min: 0,   max: 8,   step: 0.01 },
  counter:    { min: 0,   max: 1,   step: 0.01 },
  dispersion: { min: 0,   max: 0.6, step: 0.005 },
  iris:       { min: 0,   max: 1.5, step: 0.01 },
  soften:     { min: 0.02, max: 1.2, step: 0.01 },
  focus:      { min: 0.4, max: 4,   step: 0.01 },
  edgeAA:     { min: 0,   max: 6,   step: 0.05 },
  ambient:    { min: 0,   max: 1.5, step: 0.01 },
  contrast:   { min: 0.2, max: 4,   step: 0.01 },
  midpoint:   { min: 0,   max: 1,   step: 0.01 },
  bandAmount: { min: 0,   max: 1,   step: 0.01 },
  bandCount:  { min: 2,   max: 24,  step: 1    },
  bandSoft:   { min: 0,   max: 1,   step: 0.01 },
  glow:       { min: 0,   max: 1.5, step: 0.01 },
  sink:       { min: 0,   max: 0.5, step: 0.01 },
  grain:      { min: 0, max: 0.12, step: 0.002 },
  grainAnim:  { min: 0, max: 1, step: 1 },
  dither:     { min: 0,   max: 2,   step: 0.01 },
  vignette:   { min: 0,   max: 0.8, step: 0.01 },
  cursor:     { min: 0, max: 1, step: 1 },
  pointerRadius:   { min: 0.05, max: 2, step: 0.01 },
  pointerStrength: { min: 0,    max: 1, step: 0.01 },
  pointerWarp:     { min: 0,    max: 1.5, step: 0.01 },
  drag:            { min: 0,    max: 1, step: 0.01 },
  ripple:          { min: 0,    max: 2, step: 0.01 },
  rippleFreq:      { min: 2,    max: 30, step: 0.1 },
  rippleSpeed:     { min: 0,    max: 4, step: 0.01 },
  parallax:        { min: 0, max: 0.1, step: 0.001 },
  maxDpr:     { min: 0.5, max: 2,   step: 0.1 }
}
const SECTIONS = [
  ['palette', ['bgColor', 'colorA', 'colorB', 'colorC', 'colorD']],
  ['surface', ['scale', 'speed', 'chop', 'waveBase', 'waveLac', 'waveGain', 'drift', 'driftScale']],
  ['caustic', ['depth', 'counter', 'dispersion', 'iris', 'soften', 'focus', 'edgeAA', 'ambient']],
  ['tone',    ['contrast', 'midpoint', 'bandAmount', 'bandCount', 'bandSoft', 'glow', 'sink']],
  ['finish',  ['grain', 'grainAnim', 'dither', 'vignette']],
  ['pointer', ['pointerRadius', 'pointerStrength', 'pointerWarp', 'drag', 'ripple', 'rippleFreq', 'rippleSpeed', 'parallax', 'cursor']],
  ['perf',    ['maxDpr']]
]

/* the group chip highlight follows every change, so it goes out the moment a
   slider moves off the variant it is lit for */
let uiAfterApply = null
function apply() { applyConfig(); saveConfig(); renderSnapshot(); if (uiAfterApply) uiAfterApply() }

function setupColorUI() {
  const host = document.getElementById('ui-rows')
  const inputs = {}
  for (const [name, keys] of SECTIONS) {
    const h = document.createElement('div'); h.className = 'ui-sec'; h.textContent = name; host.appendChild(h)
    for (const k of keys) {
      const row = document.createElement('div'); row.className = 'ui-row'
      const lab = document.createElement('label'); lab.textContent = k; lab.title = k
      const val = document.createElement('span')
      let inp
      if (typeof CONFIG[k] === 'string') {
        inp = document.createElement('input'); inp.type = 'color'; inp.value = CONFIG[k]
        inp.oninput = e => { CONFIG[k] = e.target.value; val.textContent = ''; apply() }
      } else {
        const r = numericRanges[k] || { min: 0, max: Math.max(1, CONFIG[k] * 2), step: 0.01 }
        inp = document.createElement('input'); inp.type = 'range'
        inp.min = r.min; inp.max = r.max; inp.step = r.step; inp.value = CONFIG[k]
        val.textContent = (+CONFIG[k]).toFixed(Number.isInteger(r.step) ? 0 : 2)
        inp.oninput = e => {
          let v = parseFloat(e.target.value)
          if (Number.isInteger(r.step)) v = Math.round(v / r.step) * r.step
          CONFIG[k] = v; val.textContent = v.toFixed(Number.isInteger(r.step) ? 0 : 2); apply()
        }
      }
      inputs[k] = inp
      row.append(lab, inp, val); host.appendChild(row)
    }
  }

  const sel = document.getElementById('ui-preset')
  sel.innerHTML = '<option value="">— preset —</option>' + Object.entries(PRESETS)
    .map(([group, set]) => `<optgroup label="${group}">` + Object.keys(set).map(n => `<option>${n}</option>`).join('') + '</optgroup>')
    .join('')
  sel.onchange = e => {
    const set = Object.values(PRESETS).find(g => e.target.value in g)
    const p = set && set[e.target.value]
    if (!p) return
    for (const k in p) { CONFIG[k] = p[k]; if (inputs[k]) inputs[k].value = p[k] }
    apply()
  }

  document.getElementById('ui-head').onclick = () => document.getElementById('ui-panel').classList.toggle('closed')
  document.getElementById('ui-reload').onclick = () => location.reload()
  document.getElementById('ui-reset').onclick = () => { localStorage.removeItem(STORAGE_KEY); location.reload() }
  document.getElementById('ui-copy').onclick = () => navigator.clipboard.writeText(document.getElementById('ui-snapshot').textContent)

  /* ---- the three dice and the save (frozen chrome — do not edit per gradient).
     A roll writes the slider and lets the slider's own handler do the rest, so a
     throw costs exactly what dragging costs and nothing here knows about uniforms.
     speed is never rolled: 0.33 is the house value the whole collection shares. */
  const uiSectionKeys = {}
  for (const [name, keys] of SECTIONS) uiSectionKeys[name] = keys
  const FIXED_SECTIONS = ['palette', 'tone', 'finish', 'pointer', 'perf']
  const uiRange = k => numericRanges[k] || { min: 0, max: Math.max(1, CONFIG[k] * 2), step: 0.01 }
  /* grain and vignette are the two knobs the house style will not have shouting: rolled
     across the whole range they come back as crust and as a hard black frame */
  const SOFT_KEYS = ['grain', 'vignette']
  /* the middle band of each slider — the ends of a range are where a gradient stops
     being one, and a dice roll that lands there reads as broken rather than random */
  const uiRoll = k => {
    const r = uiRange(k)
    const lo = SOFT_KEYS.includes(k) ? 0.04 : 0.15
    const hi = SOFT_KEYS.includes(k) ? 0.45 : 0.85
    const v = r.min + (r.max - r.min) * (lo + Math.random() * (hi - lo))
    return Math.round(v / r.step) * r.step
  }
  const uiPoke = (k, v) => {
    const el = inputs[k]
    if (!el) return
    el.value = v
    el.dispatchEvent(new Event('input'))
  }
  const uiHex = (h, s, l) => {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100
    const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x]
                    : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x]
    return '#' + [r, g, b].map(v => Math.round((v + m) * 255).toString(16).padStart(2, '0')).join('')
  }
  /* a palette, not five random swatches: one hue with a little drift, and a monotone
     climb in lightness — which is what the twenty presets all are underneath */
  const rollColour = () => {
    const keys = Object.keys(CONFIG).filter(k => typeof CONFIG[k] === 'string')
    if (!keys.length) return
    const hue = Math.random() * 360, drift = -40 + Math.random() * 80
    const sat = 8 + Math.random() * 54
    const lightKey = Math.random() < 0.35
    const l0 = lightKey ? 86 + Math.random() * 10 : 4 + Math.random() * 8
    const l1 = lightKey ? 28 + Math.random() * 24 : 88 + Math.random() * 9
    keys.forEach((k, i) => {
      const t = keys.length > 1 ? i / (keys.length - 1) : 0
      uiPoke(k, uiHex(hue + drift * t, sat * (1 - 0.5 * Math.abs(t - 0.5)), l0 + (l1 - l0) * t))
    })
  }
  const rollSections = pick => {
    for (const [name, keys] of SECTIONS) {
      if (!pick(name, keys)) continue
      for (const k of keys) if (typeof CONFIG[k] === 'number' && k !== 'speed' && k !== 'maxDpr') uiPoke(k, uiRoll(k))
    }
  }
  /* Which section holds the cursor is not a question of what this file happened to call
     it. Most of the collection says `pointer`, but there are also `drag`, `finger` and
     `response` — and asking for the name alone left ⁂ cursor rolling nothing at all in
     those, while ⁂ shape rolled their cursor for them. It is the section the pointer
     drives, and every one of them carries parallax, so that is what is asked instead. */
  const isPointer = (name, keys) => name === 'pointer' || keys.includes('parallax')
  /* what the cursor does */
  const rollPointer = () => rollSections(isPointer)
  /* the gradient's own sections — whatever this file called them — which is its shape
     and its movement. speed is never in it: 0.33 is the value the collection shares. */
  const rollMotion = () => rollSections((n, keys) => !FIXED_SECTIONS.includes(n) && !isPointer(n, keys))
  /* grade and surface: contrast, midpoint, glow, grain, dither, vignette */
  const rollTone = () => rollSections(n => n === 'tone' || n === 'finish')
  document.getElementById('ui-rnd-color').onclick = rollColour
  document.getElementById('ui-rnd-pointer').onclick = rollPointer
  document.getElementById('ui-rnd-motion').onclick = rollMotion
  document.getElementById('ui-rnd-tone').onclick = rollTone
  document.getElementById('ui-rnd-all').onclick = () => {
    rollColour(); rollPointer(); rollMotion(); rollTone()
  }

  /* save writes THIS file: the dev server rewrites the CONFIG block in place, marks the
     row in the gallery as edited and re-shoots the card still. Over file:// there is
     nothing listening, so the button says so instead of failing quietly. */
  const uiNote = document.getElementById('ui-note')
  const uiSay = (t, ms) => {
    uiNote.textContent = t
    if (ms) setTimeout(() => { if (uiNote.textContent === t) uiNote.textContent = '' }, ms)
  }
  /* the same line, plus a copy for whoever is running this file in a frame: a card has
     no panel to read and the drawer's may be closed, so a silent failure looks exactly
     like a button that does nothing */
  const uiFail = t => {
    uiSay(t, 9000)
    if (window.parent !== window) parent.postMessage({ gl: 1, type: 'failed', text: t }, '*')
  }
  document.getElementById('ui-save').onclick = async () => {
    const slug = decodeURIComponent((location.pathname.split('/').pop() || '')).replace(/\.html$/, '')
    if (location.protocol === 'file:' || !slug) { uiFail('nothing was written — ⤓ save needs the dev server: npm run serve'); return }
    uiSay('saving…')
    try {
      const res = await fetch('/save', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ slug, config: CONFIG }) })
      let out = null
      try { out = await res.json() } catch (e) {}
      if (!res.ok || !out || !out.ok) throw new Error((out && out.error) ||
        (res.status === 404 || res.status === 501
          ? 'this server does not answer /save — stop it and run npm run serve again'
          : 'HTTP ' + res.status))
      localStorage.removeItem(STORAGE_KEY)      /* the file itself is the default now */
      uiSay('saved · ' + out.changed + ' values written' + (out.preview ? ' · preview rebuilding' : ''), 6000)
      if (window.parent !== window)
        parent.postMessage({ gl: 1, type: 'saved', slug, changed: out.changed, preview: out.preview }, '*')
    } catch (e) { uiFail('save failed — ' + e.message) }
  }

  /* ---- the group (frozen chrome — do not edit per gradient).
     A roll worth keeping goes into the group, and the group lives in THIS file: the dev
     server rewrites the JSON block under the panel, so the html carries its variants and
     exports with them. A chip wears one, alt-click drops it. Over file:// nothing is
     listening — the group still reads and still wears, it just cannot grow. */
  const uiSlug = () => decodeURIComponent((location.pathname.split('/').pop() || '')).replace(/\.html$/, '')
  const GROUP = (() => { try { return JSON.parse(document.getElementById('ui-group').textContent) } catch (e) { return null } })() || {}
  if (!Array.isArray(GROUP.variants)) GROUP.variants = []
  const uiGrpList = document.getElementById('ui-grp-list')
  const uiSame = (a, b) => typeof a === 'string' ? String(b).toLowerCase() === a.toLowerCase() : Math.abs(a - b) < 1e-4
  const markWorn = () => uiGrpList.querySelectorAll('.ui-var').forEach((el, i) => {
    const c = (GROUP.variants[i] || {}).config || {}
    el.classList.toggle('on', Object.keys(c).every(k => !(k in CONFIG) || uiSame(c[k], CONFIG[k])))
  })
  uiAfterApply = markWorn
  /* a chip is a picture of the variant rather than a name: its palette, in ramp order */
  function renderGroup() {
    document.getElementById('ui-grp-n').textContent = GROUP.variants.length
    const cols = Object.keys(CONFIG).filter(k => typeof CONFIG[k] === 'string')
    uiGrpList.replaceChildren(...GROUP.variants.map((v, i) => {
      const b = document.createElement('button')
      b.type = 'button'; b.className = 'ui-var'; b.textContent = i + 1
      const ramp = cols.map(k => (v.config || {})[k]).filter(Boolean)
      if (ramp.length > 1) b.style.backgroundImage = `linear-gradient(115deg, ${ramp.join(', ')})`
      b.title = (v.name || 'v' + (i + 1)) + (v.added ? ' · ' + v.added : '') + ' — click to wear it, alt-click to drop it'
      b.onclick = e => (e.altKey ? dropVariant(i) : wearVariant(i))
      return b
    }))
    markWorn()
    /* the gallery card carries the count on a badge without opening anything */
    if (window.parent !== window) parent.postMessage({ gl: 1, type: 'group', slug: uiSlug(), count: GROUP.variants.length }, '*')
  }
  /* wearing one goes through the sliders exactly as a roll does, so the read-outs, the
     snapshot and the saved state all follow from the one code path */
  function wearVariant(i) {
    const c = (GROUP.variants[i] || {}).config
    if (!c) return
    for (const k in c) {
      if (!(k in CONFIG) || typeof c[k] !== typeof CONFIG[k]) continue
      if (inputs[k]) uiPoke(k, c[k]); else CONFIG[k] = c[k]
    }
    apply()
    uiSay('wearing ' + (GROUP.variants[i].name || 'v' + (i + 1)) + ' — ⤓ save makes it the file default', 5000)
  }
  async function groupPost(op, extra) {
    const slug = uiSlug()
    if (location.protocol === 'file:' || !slug) { uiFail('nothing was written — the group needs the dev server: npm run serve'); return }
    uiSay(op === 'add' ? 'adding…' : 'dropping…')
    try {
      const res = await fetch('/group', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify(Object.assign({ slug, op }, extra)) })
      /* tolerant on purpose: a static server answers these routes with an HTML 404/501
         page, and "Unexpected token '<'" is not something anyone can act on */
      let out = null
      try { out = await res.json() } catch (e) {}
      if (!res.ok || !out || !out.ok) throw new Error((out && out.error) ||
        (res.status === 404 || res.status === 501
          ? 'this server does not answer /group — stop it and run npm run serve again'
          : 'HTTP ' + res.status))
      GROUP.variants = out.variants
      renderGroup()
      uiSay(out.dup ? 'already in the group — nothing written'
                    : out.variants.length + ' in the group · written into ' + slug + '.html', 5000)
      if (window.parent !== window)
        parent.postMessage({ gl: 1, type: 'grouped', slug, count: out.variants.length, op, dup: !!out.dup }, '*')
    } catch (e) { uiFail('group failed — ' + e.message) }
  }
  function dropVariant(i) { groupPost('drop', { index: i }) }
  document.getElementById('ui-add-group').onclick = () => groupPost('add', { config: CONFIG })
  renderGroup()
}

function renderSnapshot() {
  const body = Object.entries(CONFIG)
    .map(([k, v]) => `  ${k}: ${typeof v === 'string' ? `'${v}'` : (+v).toFixed(Number.isInteger(v) ? 0 : 3)},`)
    .join('\n')
  document.getElementById('ui-snapshot').textContent = `const CONFIG = {\n${body}\n}`
}

setupColorUI()
renderSnapshot()
/* ====== GALLERY BRIDGE (frozen chrome — do not edit per gradient) ======
   index.html runs this file in an iframe and shows the panel BESIDE the picture
   instead of on top of it. Served over http it simply takes the element out of
   here, handlers and all. Over file:// neither document may touch the other, so
   the panel travels across as markup and comes back as one message per control —
   the same input, the same event, the same handler a click here would have run.
   Nothing below runs when the file is opened on its own. */
if (window.parent !== window) {
  const uiPanel = document.getElementById('ui-panel')
  /* embedded, the panel belongs to the gallery beside the picture, so it must never
     paint in here first — not on the first mount, and not on the reload its own ⟳ and
     ↺ trigger. If nothing asks for it this was some other embed and it comes back. */
  uiPanel.style.display = 'none'
  const uiRestore = setTimeout(() => { uiPanel.style.display = '' }, 1500)
  const uiCtrl = () => uiPanel.querySelectorAll('input, select, button')
  const uiSend = m => { m.gl = 1; parent.postMessage(m, '*') }
  /* only the panel's own rules travel — the html/body/#gl rules would tear the
     gallery apart, and nothing there is named ui- */
  const uiCss = () => {
    const out = []
    for (const sheet of document.styleSheets) {
      let rules
      try { rules = sheet.cssRules } catch (e) { continue }
      for (const r of rules) if (r.selectorText && /ui-/.test(r.selectorText)) out.push(r.cssText)
    }
    return out.join('\n')
  }
  const uiState = () => uiSend({ type: 'state',
    fps: document.getElementById('ui-fps').textContent,
    note: document.getElementById('ui-note').textContent,
    vals: [...uiCtrl()].map(e => e.value),
    spans: [...uiPanel.querySelectorAll('.ui-row span')].map(e => e.textContent),
    snap: document.getElementById('ui-snapshot').textContent })
  let uiTick = 0
  addEventListener('message', e => {
    const m = e.data
    if (!m || m.gl !== 1) return
    if (m.type === 'lift') {
      clearTimeout(uiRestore)
      uiSend({ type: 'panel', html: uiPanel.outerHTML, css: uiCss() })
      uiState()
      clearInterval(uiTick)
      uiTick = setInterval(uiState, 1000)   /* the fps read-out, nothing else */
    } else if (m.type === 'card') {
      /* a live gallery card: no panel at all, and no fade-in — the card cross-fades
         from its still, so a second curtain here would only show as a flat wash */
      clearTimeout(uiRestore)
      const fadeOverlay = document.getElementById('fade')
      if (fadeOverlay) fadeOverlay.style.display = 'none'
    } else if (m.type === 'aim') {
      /* the card cannot hand the frame the real cursor without stealing the click,
         so the position is posted in and arrives as the move it would have been */
      dispatchEvent(new PointerEvent('pointermove', { clientX: m.x * innerWidth, clientY: m.y * innerHeight }))
    } else if (m.type === 'wear') {
      /* the gallery's group browser, wearing one variant. It is the chip's own click —
         nothing out there has to know what a variant is. The list is found by id, not by
         a selector, because in the drawer the panel has been lifted into the gallery's
         document and getElementById is the lookup that follows it there. */
      const list = document.getElementById('ui-grp-list')
      const chip = list && list.children[m.i]
      if (chip) chip.click()
    } else if (m.type === 'act') {
      /* a gallery card presses the panel's own buttons rather than owning any state:
         a roll from a card is the panel's roll, and its ＋ writes the same JSON */
      const b = document.getElementById(m.id)
      if (b && b.tagName === 'BUTTON') b.click()
    } else if (m.type === 'set') {
      const el = uiCtrl()[m.i]
      if (!el) return
      if (el.tagName === 'BUTTON') el.click()
      else {
        el.value = m.value
        el.dispatchEvent(new Event(el.tagName === 'SELECT' ? 'change' : 'input', { bubbles: true }))
      }
      uiState()
    }
  })
}
/* ====== END UI ====== */
</script>
</body>
</html>
